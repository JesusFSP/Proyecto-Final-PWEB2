{% extends 'reservas/base.html' %}

{% block content %}
<div ng-controller="ReservaController">
    <h2>Crear Nueva Reserva</h2>
    <form name="reservaForm" ng-submit="submitForm()" novalidate>
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre Completo</label>
            <input type="text" class="form-control" id="nombre" ng-model="reserva.nombre_cliente" required>
        </div>

        <div class="mb-3">
            <label for="correo" class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" id="correo" ng-model="reserva.correo_cliente" required>
        </div>

        <div class="mb-3">
            <label for="telefono" class="form-label">Teléfono</label>
            <input type="tel" class="form-control" id="telefono" ng-model="reserva.telefono_cliente" required>
        </div>

        <div class="mb-3">
            <label for="fecha" class="form-label">Fecha de la Reserva</label>
            <input type="date" 
               ng-model="reserva.fecha_reserva"
               min="{{ today | date:'yyyy-MM-dd' }}"
               required>
        </div>


        <div class="mb-3">
            <label for="hora" class="form-label">Hora de la Reserva</label>
            <input type="time"
               ng-model="reserva.hora_reserva"
               min="11:00"
               max="23:00"
               required>
        </div>

        <div class="mb-3">
            <label for="personas" class="form-label">Número de Personas</label>
            <input type="number" class="form-control" id="personas" ng-model="reserva.cantidad_personas" min="1"
                required>
        </div>

        <div class="mb-3" ng-if="disponibilidad !== null">
            <div class="alert" ng-class="{'alert-success': disponibilidad, 'alert-danger': !disponibilidad}">
                <span ng-if="disponibilidad">¡Hay mesas disponibles para esta fecha y hora!</span>
                <span ng-if="!disponibilidad">No hay mesas disponibles para esta fecha y hora. Por favor, seleccione
                    otro horario.</span>
            </div>
        </div>

        <button type="submit" ng-disabled="reservaForm.$invalid">
            Reservar
        </button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    app.controller('ReservaController', function ($scope, $http) {
        $scope.reserva = {};

        $scope.submitForm = function () {
            if ($scope.reservaForm.$valid) {
                $http.post('/api/reservas/', $scope.reserva)
                    .then(function (response) {
                        alert('¡Reserva creada con éxito!');
                        $scope.reserva = {};
                    }, function (error) {
                        alert('Error al crear la reserva: ' + error.data.error);
                    });
            }
        };
    });
</script>
{% endblock %}
